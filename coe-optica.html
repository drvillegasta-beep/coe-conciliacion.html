<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6C71">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COE Óptica">
<title>COE Óptica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* COE Óptica · Layout: herramienta de mostrador — encabezado fijo, pestañas, tablero de semáforos arriba y listas operativas debajo */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#14282C; --muted:#5A6D71; --line:#D7E0E1;
  --accent:#0E6C71; --accent-ink:#FFFFFF; --accent-soft:#DDEFEF;
  --ok:#23824F; --ok-soft:#E1F2E8; --warn:#B57A0A; --warn-soft:#FBF0D9; --bad:#BE3B28; --bad-soft:#FBE4DF;
  --display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1618; --surface:#142124; --ink:#E3ECEC; --muted:#93A7AA; --line:#25393D;
  --accent:#4DB2B3; --accent-ink:#06191B; --accent-soft:#16383A;
  --ok:#5CC28B; --ok-soft:#173326; --warn:#E2AE48; --warn-soft:#3A2D10; --bad:#EE7A64; --bad-soft:#3E1C16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#142124; --ink:#E3ECEC; --muted:#93A7AA; --line:#25393D;
  --accent:#4DB2B3; --accent-ink:#06191B; --accent-soft:#16383A;
  --ok:#5CC28B; --ok-soft:#173326; --warn:#E2AE48; --warn-soft:#3A2D10; --bad:#EE7A64; --bad-soft:#3E1C16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.04em;flex:none}
.brand b{font-family:var(--display);font-size:18px;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.proto{margin-left:auto;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:4px 10px;border-radius:99px;white-space:nowrap}
.top-row select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px;font-variant-numeric:tabular-nums}
main{padding-block:18px 60px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
.sub{color:var(--muted);margin:2px 0 0}
.section{display:grid;gap:12px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left}
.stage:hover{border-color:var(--accent)}
.stage .big{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:1px}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}
/* attention lists */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.count.bad{background:var(--bad-soft);color:var(--bad)}.count.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover .nm{color:var(--accent)}
.stripe{align-self:stretch;border-radius:4px}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-bad{background:var(--bad)}.s-none{background:var(--line)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.why.bad{color:var(--bad)}.why.warn{color:var(--warn)}.why.ok{color:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* pills & buttons */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--bg);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#1f8f55;border-color:#1f8f55;color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rx{font-family:var(--mono);font-size:13px;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
/* filters */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0}
.toolbar input{flex:1 1 220px}
/* forms */
.form{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:grid;gap:4px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f input.err,.f select.err{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:12px;color:var(--muted)}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--accent-soft);color:var(--accent)}
.rxgrid{display:grid;grid-template-columns:40px repeat(6,minmax(0,1fr));gap:6px;align-items:center}
@media (max-width:560px){.rxgrid{grid-template-columns:30px repeat(3,minmax(0,1fr))}.rxgrid .hidem{display:none}}
.rxgrid input{font-family:var(--mono);text-align:center;padding:8px 4px}
.rxgrid .eye{font-family:var(--display);font-weight:700}
.rxgrid .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(5,15,17,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(620px,100%);height:100%;overflow-y:auto;padding:0 0 40px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet-head .x{margin-left:auto}
.sheet-body{padding:16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0}
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;font-size:14px;padding:5px 0;align-items:center}
.timeline .tdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.timeline li.done .tdot{background:var(--accent);border-color:var(--accent)}
.timeline li.cur .tdot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.timeline li:not(.done):not(.cur){color:var(--muted)}
.timeline .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px}
.checks input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.checks .lock{margin-left:auto;font-size:12px;color:var(--bad);font-weight:600}
.money{font-variant-numeric:tabular-nums}
.saldo{font-family:var(--display);font-size:22px;font-weight:600}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
/* order sheets */
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order .ohead{background:var(--accent-soft);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.order .ohead b{font-family:var(--display);font-size:16px}
.order table th{background:transparent}
.hv{display:grid;gap:10px;padding:14px}
.hv .hvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.hv .hvgrid{grid-template-columns:1fr 1fr}}
.hv .cell{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;min-width:0}
.hv .cell span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiny{font-size:12px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* login */
.login{max-width:760px;margin:24px auto;display:grid;gap:16px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.roles{grid-template-columns:1fr}}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.role[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
/* archivos */
.upload{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.upload.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.upload.err{border-color:var(--bad);background:var(--bad-soft)}
.upload input{font-size:13px;max-width:100%}
.upload img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.upload .fname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
/* formato Sra. Angy: hoja de papel, colores fijos como el formato impreso */
.paper{background:#fff;color:#111;border:1px solid #bbb;overflow-x:auto}
.paper table{border-collapse:collapse;width:100%;min-width:620px;font-family:"Figtree",Arial,sans-serif}
.paper th,.paper td{border:1px solid #333;padding:10px 12px;color:#111;vertical-align:middle}
.paper .ttl{background:#BDF3F6;text-align:center;font-weight:700;font-size:20px;letter-spacing:.01em;text-transform:none}
.paper .cols th{background:#D9D9D9;text-align:center;font-size:13px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:#111}
.paper td.g{white-space:nowrap}
.paper td.g div+div{margin-top:14px}
/* inicio por prioridades */
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.bigbtn{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:92px}
.bigbtn:hover{border-color:var(--accent)}
.bigbtn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bigbtn .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.bigbtn.main .ic{background:rgba(255,255,255,.2);color:inherit}
.bigbtn b{font-family:var(--display);font-size:20px;font-weight:600;display:block;line-height:1.2}
.bigbtn small{opacity:.85;font-size:13px}
.lane{display:grid;gap:8px;margin-top:22px}
.lane-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.task:hover{border-color:var(--accent)}
.pri{width:12px;height:12px;border-radius:50%;flex:none}
.t1{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2 .wb{color:var(--bad);font-weight:600}.t2 .ww{color:var(--warn);font-weight:600}.t2 .wo{color:var(--ok);font-weight:600}
.go{font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.calm{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer;flex-wrap:wrap}
.calm:hover{border-color:var(--accent)}
@media (max-width:560px){.task.pv{grid-template-columns:auto minmax(0,1fr)}.task.pv .actions{grid-column:2;justify-content:flex-start!important}.t2{white-space:normal}}
/* segmentos */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg .c{font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}
/* asistente de nuevo trabajo */
.stepper{list-style:none;padding:0;margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:13px}
.stepper li.cur{color:var(--ink)}.stepper li.cur span{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.stepper li.done span{border-color:var(--accent);color:var(--accent)}
.stepper li+li::before{content:"";width:16px;height:2px;background:var(--line)}
.drop{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 16px;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);cursor:pointer}
.drop b{font-family:var(--display);font-size:20px;font-weight:600}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:26px;font-weight:700}
.drop input{max-width:100%;font-size:13px}
.lks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
@media (max-width:560px){.lks{grid-template-columns:1fr}}
.lk{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.lk span{color:var(--muted)}.lk b{text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.newhdr{white-space:nowrap}
/* ---- capa visual v4 ---- */
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
header.top{box-shadow:0 1px 0 var(--line)}
.logo{width:40px;height:40px;border-width:2.5px}
nav.tabs button{display:inline-flex;align-items:center;gap:7px;position:relative}
nav.tabs button .ico{width:18px;height:18px}

<script>
/* ================= COE Óptica · núcleo ================= */
const SB_URL='https://ckjkdenwqicdjvodflba.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNramtkZW53cWljZGp2b2RmbGJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDIzMzgsImV4cCI6MjA4OTE3ODMzOH0.7pd1oAevIWY81e0DTSMBFtzSECfQNa_mOqstG_UEj-0';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let TOKEN=store.get('coeopt-token'), DB=null, CFG=null, ME=null, HOY=new Date();
let VIEW=store.get('coeopt-tab')||'', SEDE='all', OPEN=null, BUSY=false;

/* ---------- utilidades ---------- */
const dayMs=864e5;
const toD=s=>{if(!s) return null; if(s instanceof Date) return s; const t=String(s); return new Date(t.length<=10?t+'T12:00:00':t)};
const diff=(a,b)=>Math.round((toD(b)-toD(a))/dayMs);
const fmt=d=>d? toD(d).toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','') : '—';
const fmtY=d=>d? toD(d).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}).replace('.','') : '—';
const iso=d=>{const x=toD(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const money=n=>'$'+(Math.round((+n||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(d,n)=>{const x=new Date(toD(d));x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(toD(d));x.setMonth(x.getMonth()+n);return x};
function nextWeekday(from,wd){const d=new Date(toD(from));d.setDate(d.getDate()+((wd-d.getDay()+7)%7||7));return d}
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,\s]/g,''));return isNaN(n)?0:n};
const fmtTel=x=>{const t=String(x||'').replace(/\D/g,'');return t.length===10?`(${t.slice(0,3)}) ${t.slice(3,6)} ${t.slice(6)}`:t};
const edad=n=>{if(!n) return '—';const b=toD(n);let a=HOY.getFullYear()-b.getFullYear();if(HOY<new Date(HOY.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const iniciales=n=>String(n||'').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function toast(m,bad){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),bad?4800:2600)}
function cleanErr(e){let m=(e&&(e.message||e.error_description||e.details))||String(e);m=m.replace(/^(DATOS|REGLA|PERMISO|PIN|LOGIN|SESION|ACCESO):\s*/,'');return m}

/* ---------- servidor ---------- */
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,args);
  if(error){ if(/^SESION/.test(error.message||'')){salir(true)} throw error }
  return data;
}
async function cargar(){
  DB=await rpc('opt_datos',{p_token:TOKEN});
  CFG=DB.config; ME=DB.yo; HOY=toD(DB.hoy);
  DB.trabajos.forEach(t=>{t.pagos=t.pagos||[];t.eventos=t.eventos||{};t.checklist=t.checklist||{};t.rx=t.rx||{};t.armazon=t.armazon||{};t.precio=t.precio||{};t.costo=t.costo||{}});
}
async function act(accion,data,pin){
  if(BUSY) return null; BUSY=true; document.body.classList.add('busy');
  try{const r=await rpc('opt_accion',{p_token:TOKEN,p_accion:accion,p_data:data||{},p_pin:pin||null});await cargar();render();if(OPEN)drawSheet();return r}
  catch(e){toast(cleanErr(e),true);return null}
  finally{BUSY=false;document.body.classList.remove('busy')}
}
async function edge(body){
  const r=await fetch(`${SB_URL}/functions/v1/opt-archivo`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({token:TOKEN,...body})});
  const j=await r.json().catch(()=>({error:'Respuesta no válida del servidor'}));
  if(!r.ok||j.error) throw new Error(j.error||('Error '+r.status));
  return j;
}
async function comprimir(file){
  if(!file.type.startsWith('image/')||/heic|heif/i.test(file.type)) return file;
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file)});
  const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));
  return new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});
}
async function subirArchivo(file){
  const f=await comprimir(file);
  const {path,token}=await edge({accion:'subir',nombre:f.name});
  const {error}=await sb.storage.from('optica').uploadToSignedUrl(path,token,f,{contentType:f.type||'application/octet-stream'});
  if(error) throw error;
  return path;
}
async function verArchivo(path){
  const w=window.open('','_blank');
  try{const {url}=await edge({accion:'ver',ruta:path}); if(w) w.location=url; else location.href=url}
  catch(e){if(w) w.close(); toast(cleanErr(e),true)}
}

/* ---------- lectura del ticket (PDF de eOptics) ---------- */
async function textoPDF(file){
  if(!window.pdfjsLib||file.type!=='application/pdf') return '';
  try{const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();out+=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}
    return out}catch(e){return ''}
}
function leerTicket(tx){
  const r={}; if(!tx) return r; const T=tx.replace(/ /g,' ');
  const m=(re,i=1)=>{const x=re.exec(T);return x?x[i].trim():''};
  r.venta=m(/venta\s*(?:no\.?|n[uú]m(?:ero)?\.?|#|:)?\s*:?\s*(\d{4,8})/i);
  r.id_trabajo=m(/id\s*(?:de\s*)?trabajo\s*(?:no\.?|#|:)?\s*:?\s*(\d{3,8})/i);
  r.total=m(/total\s*(?:a\s*pagar|venta|neto)?\s*:?\s*\$?\s*([\d,]+\.\d{2})/i);
  r.anticipo=m(/(?:anticipo|abono|a\s*cuenta|su\s*pago|pago\s*recibido|importe\s*pagado|pagado)\s*:?\s*\$?\s*([\d,]+\.\d{2})/i);
  r.paciente=m(/(?:paciente|cliente)\s*:?\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑa-záéíóúñ.]+(?:\s+[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑa-záéíóúñ.]+){1,4})/);
  r.telefono=m(/(?:tel[eé]fono|tel\.?|cel(?:ular)?)\s*:?\s*(\d{10})/i);
  const f=m(/\b(efectivo|tarjeta|transferencia|cr[eé]dito|d[eé]bito)\b/i); r.forma=f?(/transf/i.test(f)?'Transferencia':/efect/i.test(f)?'Efectivo':'Tarjeta'):'';
  Object.keys(r).forEach(k=>{if(!r[k]) delete r[k]});
  if(r.total) r.total=num(r.total); if(r.anticipo) r.anticipo=num(r.anticipo);
  return r;
}

/* ---------- reglas de negocio ---------- */
const ESTADOS=[['capturado','Capturado'],['enviado','En laboratorio'],['recibido','Recibido · falta revisión'],['listo','Listo para avisar'],['avisado','Avisado · por recoger'],['entregado','Entregado'],['garantia','Garantía']];
const ENOM=Object.fromEntries(ESTADOS);
const GRUPOS=[['capturado','Por pedir'],['enviado','En laboratorio'],['recibido','Por revisar'],['listo','Por avisar'],['avisado','Por recoger'],['garantia','Garantía'],['entregado','Entregados']];
const PATENTADAS=['Blue Free','Blue-ray','Alta Force','Panoramic','Thin & Lite','Thin and Lite'];
const total=t=>+t.total||0;
const pagado=t=>t.pagos.reduce((s,p)=>s+(+p.monto||0),0);
const saldo=t=>Math.max(0,Math.round((total(t)-pagado(t))*100)/100);
const pctPag=t=>total(t)?pagado(t)/total(t)*100:0;
const patentada=t=>PATENTADAS.some(p=>((t.tratamiento||'')+' '+(t.material||'')).toLowerCase().includes(p.toLowerCase()));
const ev=(t,k)=>t.eventos[k]?toD(t.eventos[k]):null;
const vis=()=>DB.trabajos.filter(t=>SEDE==='all'||t.sede===SEDE);
function margen(t){
  const out=[];
  const pa=+t.precio.armazon||0, ca=+t.costo.armazon||0, pm=+t.precio.mica||0, cm=+t.costo.mica||0;
  if(!t.armazon.propio&&ca&&pa/ca<CFG.factor.armazon) out.push(`armazón ×${(pa/ca).toFixed(2)}`);
  if(cm&&pm/cm<CFG.factor.mica) out.push(`mica ×${(pm/cm).toFixed(2)}`);
  return out;
}
function sem(t){
  switch(t.estado){
    case 'capturado':{
      if(pctPag(t)<CFG.anticipo) return ['bad',`Anticipo ${Math.round(pctPag(t))}%: falta para pedir`];
      if(!t.respaldo) return ['warn','Sin respaldo de graduación'];
      const d=diff(t.fecha_venta,HOY); return d>=1?['bad',`Sin pedir hace ${d} d`]:['ok','Va en el pedido de hoy'];}
    case 'enviado':{if(!t.llega) return ['ok','En laboratorio'];const d=diff(HOY,t.llega); if(d<0) return ['bad',`Laboratorio atrasado ${-d} d`]; if(d<=1) return ['warn',d?'Llega mañana':'Llega hoy']; return ['ok',`Llega ${fmt(t.llega)}`];}
    case 'recibido':{const d=diff(ev(t,'recibido'),HOY); return d>=1?['bad',`Sin revisar hace ${d} d`]:['warn','Revisar hoy'];}
    case 'listo':{const d=diff(ev(t,'listo'),HOY); return d>=1?['bad',`Sin avisar hace ${d} d`]:['warn','Avisar hoy'];}
    case 'avisado':{const d=diff(ev(t,'avisado'),HOY); if(d>30) return ['bad',`${d} d sin recoger`]; if(d>7) return ['warn',`${d} d sin recoger`]; return ['ok',`Avisado hace ${d} d`];}
    case 'garantia': return ['bad','Garantía abierta'];
    default: return ['ok','Entregado'];
  }
}
function prioridad(t){ if(t.estado==='entregado') return null; const l=sem(t)[0]; if(l==='bad') return 'ahora'; if(l==='warn'||['capturado','listo','recibido'].includes(t.estado)) return 'hoy'; return 'ok'; }
function accion(t){
  const l=sem(t)[0];
  switch(t.estado){
    case 'capturado': return pctPag(t)<CFG.anticipo?'Cobrar anticipo':(!t.respaldo?'Subir respaldo':'Va en el pedido');
    case 'enviado': return l==='bad'?'Reclamar al laboratorio':'Ver';
    case 'recibido': return 'Revisar calidad';
    case 'listo': return 'Avisar al paciente';
    case 'avisado': return l==='ok'?'Ver':(saldo(t)?'Llamar y cobrar':'Llamar al paciente');
    case 'garantia': return 'Seguir garantía';
  } return 'Ver';
}
function llegadaLab(lab){
  const L=(CFG.labs||[]).find(x=>x.nombre===lab);
  if(L&&L.recoleccion_dia!=null&&L.recoleccion_dia!=='') return nextWeekday(HOY,+L.recoleccion_dia);
  return addDays(HOY,L?(+L.dias||5):5);
}
function comision(t){
  const lines=[]; const fe=ev(t,'entregado')||HOY;
  const vig=(CFG.promos||[]).filter(p=>p.activa&&fe>=toD(p.ini)&&fe<=toD(p.fin));
  const lc=/contacto/i.test(t.tipo||'');
  const partes=lc?[['lc',+t.precio.mica||total(t),'Lentes de contacto']]:[['armazon',+t.precio.armazon||0,'Armazón'],['mica',+t.precio.mica||0,'Micas']];
  let sum=0;
  partes.forEach(([cat,base,lab])=>{ if(!base) return;
    let pct=+CFG.com[cat]||0; const marca=((t.armazon.marca||'')+' '+(t.tratamiento||'')+' '+(t.material||'')).toLowerCase();
    const promo=vig.find(p=>p.cat===cat&&p.marca&&marca.includes(String(p.marca).toLowerCase()));
    if(promo) pct+=+promo.extra||0;
    if(t.referido&&CFG.ref&&+CFG.ref.comExtra) pct+=+CFG.ref.comExtra;
    const m=Math.round(base*pct)/100; sum+=m; lines.push({lab,base,pct,m,promo:promo?promo.nombre:''});
  });
  return {sum:Math.round(sum*100)/100,lines};
}
function refBenef(){const r=CFG.ref||{};return r.nuevoTipo==='monto'?money(r.nuevoValor)+' de descuento':r.nuevoTipo==='porcentaje'?r.nuevoValor+'% de descuento':'Antirreflejante sin costo'}
const clinic=()=>`WhatsApp Óptica ${fmtTel(CFG.waOptica)} · Tel. clínica (443) 465 6645 / (459) 596 2268`;
const waLink=(tel,txt)=>`https://wa.me/52${String(tel||'').replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent(txt)}`;

/* ================= íconos, pestañas y ventanas ================= */
const ICP={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 list:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
 file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',

/* pago con ticket: el monto se lee del PDF; si es foto se captura y queda por verificar */
function modalPago(t,titulo,sugerido){
  let file=null, leido=null;
  const box=modal(`<h3>${esc(titulo)}</h3><p class="tiny">Suba el ticket de eOptics. Si es PDF, el monto se lee del ticket y no se puede editar. Si es foto, Contabilidad lo verifica.</p>
    <label class="drop" style="padding:18px"><span class="ic">${ico('upload')}</span><input type="file" accept="image/*,application/pdf" id="pg-file"><span class="tiny">PDF o foto del ticket</span></label>
    <div id="pg-out" class="form"></div>
    <div class="actions"><button class="btn primary" data-ok disabled>Registrar pago</button><button class="btn" data-k>Cancelar</button></div>`,async(e,b)=>{
      if(!e.target.closest('[data-ok]')) return;
      const monto=leido&&leido.anticipo?leido.anticipo:num(b.querySelector('#pg-monto')?.value);
      const forma=leido&&leido.forma?leido.forma:b.querySelector('#pg-forma')?.value||'Efectivo';
      if(monto<=0){toast('Escriba el monto del ticket',true);return}
      if(monto>saldo(t)+0.01){toast(`El pago es mayor al saldo (${money(saldo(t))})`,true);return}
      const btn=b.querySelector('[data-ok]');btn.disabled=true;btn.textContent='Subiendo ticket…';
      try{const path=await subirArchivo(file);b.remove();
        const r=await act('pago_registrar',{trabajo_id:t.id,monto,forma,archivo:path,leido:!!(leido&&leido.anticipo)});
        if(r) toast('Pago registrado con su ticket');
      }catch(err){btn.disabled=false;btn.textContent='Registrar pago';toast(cleanErr(err),true)}
    });
  box.querySelector('#pg-file').addEventListener('change',async e=>{
    file=e.target.files[0]; if(!file) return; const out=box.querySelector('#pg-out'); out.innerHTML='<div class="alert info">Leyendo ticket…</div>';
    leido=leerTicket(await textoPDF(file));
    if(leido.venta&&leido.venta!==t.venta) out.innerHTML=`<div class="alert warn">! El ticket es de la venta ${esc(leido.venta)} y este trabajo es la ${esc(t.venta)}. Revise que sea el ticket correcto.</div>`; else out.innerHTML='';
    if(leido.anticipo) out.innerHTML+=`<div class="lks" style="grid-template-columns:1fr">${lk('Monto leído del ticket',money(leido.anticipo))}${lk('Forma de pago',leido.forma||'—')}</div>`;
    else out.innerHTML+=`<div class="alert warn">! No se pudo leer el monto${file.type==='application/pdf'?'':' de una foto'}. Escríbalo tal como aparece; queda pendiente de verificar por Contabilidad.</div>
      <div class="fields"><div class="f"><label for="pg-monto">Monto del ticket</label><input id="pg-monto" inputmode="decimal" value="${sugerido?Math.round(sugerido):''}"></div>
      <div class="f"><label for="pg-forma">Forma de pago</label><select id="pg-forma"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></div></div>`;
    box.querySelector('[data-ok]').disabled=false;
  });
}

function w1Check(){
  const f=NEW.f, box=document.getElementById('w1-chk'); if(!box) return true;
  const errs=[],warns=[];

  else if(DB.trabajos.some(t=>t.venta===f.venta)) errs.push('Esa venta ya está registrada.');
  if(!f.paciente_nombre.trim()) errs.push('Falta el nombre del paciente.');
  if(!/^\d{10}$/.test(String(f.telefono).replace(/\D/g,''))) errs.push('El WhatsApp debe tener 10 dígitos.');
  const tot=num(f.total), ant=num(f.anticipo);
  if(tot<=0) errs.push('Falta el total de la venta.');
  if(ant<=0) errs.push('Falta el anticipo pagado.');
  if(ant>tot) errs.push('El anticipo no puede ser mayor al total.');
  const suma=num(f.precio_arm)+num(f.precio_mica);
  if(tot>0&&suma>0&&Math.abs(suma-tot)>1) warns.push(`Armazón + micas suman ${money(suma)} y el total es ${money(tot)}. Revise los importes (descuento de consulta u otros productos).`);
  if(tot>0&&ant>0&&ant/tot*100<CFG.anticipo) warns.push(`Anticipo de ${Math.round(ant/tot*100)}%: se guarda, pero no entra al pedido hasta completar el ${CFG.anticipo}%.`);
  const pm=num(f.precio_mica), cm=num(f.costo_mica); if(cm&&pm/cm<CFG.factor.mica) warns.push(`Margen de micas ×${(pm/cm).toFixed(2)}, debajo del factor ${CFG.factor.mica}.`);
  box.innerHTML=errs.map(e=>`<div class="alert bad">✕ ${esc(e)}</div>`).join('')+warns.map(w=>`<div class="alert warn">! ${esc(w)}</div>`).join('');
  const b=document.getElementById('w1-next'); if(b) b.disabled=!!errs.length;
  return !errs.length;
}

  const examen={optometrista:v('x-opt'),av:{},rx:{},dx:[...EX.dx],notas:v('x-notas'),archivo};

  let r;

  else{const [y,m,d]=v('x-nac').split('-').map(Number);r=await act('paciente_crear',{nombre:v('x-nom'),nacimiento:v('x-nac'),telefono:v('x-tel').replace(/\D/g,''),sede:ME.sede,examen})}

  const pid=p?p.id:r.id; EX.dx=[]; EX.form=false; EX.nuevo=false; EX.sel=pid; toast('Guardado en el expediente');
  if(EX.regresar){EX.regresar=false;NEW.paciente_id=pid;VIEW='nuevo';NEW.step=2}
  render(); window.scrollTo(0,0);
}

const MOTIVOS={seg:'Seguimiento a 7 días',mant:'Mantenimiento',renov:'Renovación sugerida',anual:'Revisión anual de la vista',lc:'Reposición de lentes de contacto',adapt:'Control de adaptación',recoger:'Lentes sin recoger'};
function posventaLista(){
  if(!DB) return [];
  const out=[]; const R=DB.posventa||{};
  const add=(o)=>{const r=R[o.clave];o.res=r?r.resultado:'Sin contactar';o.hecho=!!r&&r.resultado!=='Sin contactar';out.push(o)};
  DB.trabajos.forEach(t=>{
    const lc=/contacto/i.test(t.tipo||''); const prod=lc?'lc':'armazon';
    if(t.estado==='entregado'){
      const fe=ev(t,'entregado'); if(!fe) return; const d=diff(fe,HOY);
      if(!lc&&d>=7&&d<=21) add({clave:'seg:'+t.id,key:'seg',prod,pac:t.paciente_nombre,tel:t.telefono,det:`${t.tipo} entregado el ${fmt(fe)}. Preguntar cómo se adapta.`});

      if(lc&&+t.armazon.lc_dias){const fin=addDays(fe,+t.armazon.lc_dias);const k=diff(HOY,fin);if(k<=3&&k>=-20) add({clave:'lc:'+t.id,key:'lc',prod,pac:t.paciente_nombre,tel:t.telefono,det:`Se le acaban alrededor del ${fmt(fin)}.`})}
      if(!lc){const meses=(HOY.getFullYear()-fe.getFullYear())*12+HOY.getMonth()-fe.getMonth();const M=+CFG.mantenimiento||6;const k=Math.floor(meses/M);
        if(k>=1){const due=addMonths(fe,k*M);const dd=diff(due,HOY);if(dd>=0&&dd<=30) add({clave:`mant:${t.id}:${k}`,key:'mant',prod,pac:t.paciente_nombre,tel:t.telefono,det:`Lentes entregados el ${fmtY(fe)}. Le toca su mantenimiento.`})}
        if(meses>=(+CFG.renovacion||24)&&meses<=(+CFG.renovacion||24)+2) add({clave:'renov:'+t.id,key:'renov',prod,pac:t.paciente_nombre,tel:t.telefono,det:`Sus lentes tienen ${meses} meses.`});}
    }

  });

  return out;
}

  const pagados=new Set(DB.cierres.flatMap(c=>Object.keys(c.detalle||{})));

  return per.map(t=>({t,c:comision(t)}));
}

  else if(t.estado==='recibido'){const all=qc.every(([k])=>c[k]);action=`<div class="card"><h3>Revisión de calidad</h3><div class="checks">${qc.map(([k,lab])=>`<label><input type="checkbox" data-chk="${k}" ${c[k]?'checked':''}>${lab}</label>`).join('')}</div><div class="actions"><button class="btn primary" data-step="listo" ${all?'':'disabled'}>Aprobar y marcar listo</button><button class="btn danger" data-garantia>Rechazar: devolver al laboratorio</button></div></div>`}
  else if(t.estado==='listo') action=`<div class="card"><h3>Siguiente paso</h3><p class="tiny">Avise hoy al paciente. El mensaje incluye el saldo y los teléfonos.</p><div class="actions"><button class="btn wa" data-wa="listo">Avisar por WhatsApp</button></div></div>`;
  else if(t.estado==='avisado'){const all=ent.every(([k,,lock])=>c[k]&&!lock);action=`<div class="card"><h3>Entrega</h3>${saldo(t)?`<div class="alert warn">! Saldo de ${money(saldo(t))}. No se entrega sin liquidar.</div>`:''}<div class="checks">${ent.map(([k,lab,lock])=>`<label><input type="checkbox" data-chk="${k}" ${c[k]&&!lock?'checked':''} ${lock?'disabled':''}>${lab}${lock?'<span class="lock">Falta pagar</span>':''}</label>`).join('')}</div><div class="actions"><button class="btn primary" data-step="entregado" ${all?'':'disabled'}>Entregar</button>${saldo(t)?`<button class="btn" data-pagar>${ico('ticket','sm')}Subir ticket de liquidación</button>`:''}<button class="btn wa" data-wa="recordatorio">Recordatorio</button><button class="btn" data-printent>${ico('print','sm')}Hoja de entrega</button></div></div>`}

  if(C('[data-garantia]')){modalGarantia(t);return}
  if(C('[data-printlab]')){imprimir(hojaLab(t));return}
  if(C('[data-printent]')){imprimir(hojaEntrega(t));return}
  if(el=C('[data-wa]')){const k=el.dataset.wa;mensajeWA(waMsg(t,k),t.telefono,k==='listo'?async()=>{const r=await act('trabajo_estado',{id:t.id,estado:'avisado'});if(r)toast('Aviso registrado')}:()=>act('aviso_registrar',{id:t.id,tipo:k}));return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const L=document.getElementById('layer');const sc=L.querySelectorAll('.scrim');if(sc.length>1)sc[sc.length-1].remove();else closeSheet()}});

/* ================= arranque ================= */
(async function(){
  if(TOKEN){try{await cargar()}catch(e){TOKEN=null;store.del('coeopt-token')}}
  render();
  setInterval(async()=>{if(TOKEN&&ME&&!BUSY&&!document.querySelector('.scrim.center')&&VIEW!=='nuevo'&&VIEW!=='config'&&VIEW!=='referidos'&&!EX.form&&!EX.nuevo){try{await cargar();render();if(OPEN)drawSheet()}catch(e){}}},60000);
})();

</script>
</body>
</html>
